[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ado2github-migrator"
version = "0.1.0"
description = "Azure DevOps to GitHub migration scaffold"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0",
  "typer>=0.12,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
ado2github = "ado2github_migrator.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
