name: ado_github_migration_agent
version: 0.1.0
model:
  provider: orchestrator_injected
  default_model: Qwen/Qwen2.5-Coder-7B-Instruct
  low_resource_model: qwen2.5-coder:1.5b
  temperature: 0.1
  max_tokens: 4096
safety:
  default_dry_run: true
  require_approval_for_remote_writes: true
scope:
  migration_unit: single_repository
